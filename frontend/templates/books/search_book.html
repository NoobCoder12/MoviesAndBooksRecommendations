{% extends "layouts/layout.html" %}
{% load static %} 


{% block title %}
Recommendations for books
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'books/css/style.css' %}">
{% endblock %}
    
{% block body %}
<div class="search">
    <form method="GET" action="{% url 'books:get_books' %}">
        <input type="text" id="search" name="title" placeholder="Start typing book title">
        <button type="submit">Search</button>
    </form>
    <div id="results"></div>
</div>   
{% endblock %}
